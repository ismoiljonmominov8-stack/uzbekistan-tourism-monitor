name: Weekly chart

on:
  schedule:
    - cron: "23 5 * * 1"     # Mondays 10:23 Tashkent time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post weekly chart
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_LANG: ${{ vars.POST_LANG || 'uz' }}
        run: python -m src.main weekly
      - name: Save state
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: weekly post $(date -u +%F)"
          git push || (git pull --rebase && git push)
