name: Fetch campaign photos (manual)
on: workflow_dispatch
concurrency: data
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m src.fetch_photos
      - run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add landing/photos/raw
          git diff --cached --quiet && exit 0
          git commit -m "data: candidate campaign photos from Wikimedia Commons"
          git push || (git pull --rebase && git push)
