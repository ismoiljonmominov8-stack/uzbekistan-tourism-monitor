name: Fetch Google travel-intent searches (manual)
on: workflow_dispatch
concurrency: data
jobs:
  intent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytrends==4.9.2
      - run: python -m src.intent
      - run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intent_monthly.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: Google travel-intent searches"
          git push || (git pull --rebase && git push)
