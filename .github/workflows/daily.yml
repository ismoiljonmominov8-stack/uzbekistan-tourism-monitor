name: Daily collect & post

on:
  schedule:
    - cron: "47 4 * * *"   # 09:47 Tashkent time, every day
    - cron: "23 5 * * *"   # backups: GitHub sometimes skips a scheduled run;
    - cron: "11 6 * * *"   # the job runs only once per day (run_date guard)
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect data and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POST_LANG: ${{ vars.POST_LANG || 'uz' }}
          NEWS_APPROVAL: ${{ vars.NEWS_APPROVAL || 'on' }}
        run: python -m src.main daily
      - name: Save data to the repository
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "data: daily update $(date -u +%F)"
          git push || (git pull --rebase && git push)
