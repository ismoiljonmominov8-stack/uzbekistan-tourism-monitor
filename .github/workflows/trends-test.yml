name: Google Trends (manual run)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect"
        default: "collect"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytrends==4.9.2
      - run: python -m src.trends ${{ github.event.inputs.mode || 'collect' }}
      - name: Commit report
        if: always()
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends_share.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "reports: Google Trends test"
          git push || (git pull --rebase && git push)
