name: Collect data only (no posts)

on:
  workflow_dispatch: {}      # refresh data, effects and the chart page without posting anything

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and rebuild
        env:
          DRY_RUN: "1"
        run: python -m src.main refresh
      - name: Save data to the repository
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "data: collect only $(date -u +%F)"
          git push || (git pull --rebase && git push)
