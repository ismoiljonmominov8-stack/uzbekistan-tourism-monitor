name: Debug SIAT datasets

on:
  workflow_dispatch:
    inputs:
      first: {description: "first dataset id", required: true}
      last: {description: "last dataset id", required: true}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.debug_siat ${{ github.event.inputs.first }} ${{ github.event.inputs.last }}
      - name: Commit
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "reports: SIAT dataset index"
          git push || (git pull --rebase && git push)
