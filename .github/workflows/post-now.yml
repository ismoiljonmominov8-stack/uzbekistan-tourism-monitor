name: Post daily index now

on:
  workflow_dispatch: {}      # re-post today's daily index (e.g. after a correction)

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          POST_LANG: ${{ vars.POST_LANG || 'uz' }}
        run: python -m src.main post-daily-now
      - name: Save data to the repository
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "data: manual daily post $(date -u +%F)"
          git push || (git pull --rebase && git push)
