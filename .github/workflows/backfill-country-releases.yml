name: Backfill single-country stat.uz releases (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.country_releases backfill
      - name: Commit
        if: always()
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/country_releases.csv reports/statuz_archive/raw
          git diff --cached --quiet && exit 0
          git commit -m "data: single-country stat.uz releases"
          git push || (git pull --rebase && git push)
