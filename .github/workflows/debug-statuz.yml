name: Debug stat.uz parser

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated stat.uz release URLs"
        required: true

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save raw release text
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: python -m src.debug_statuz $URLS
      - name: Commit
        run: |
          git config user.name "tourism-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "reports: stat.uz raw text"
          git push || (git pull --rebase && git push)
